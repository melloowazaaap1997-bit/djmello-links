<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Mello - Official Links</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    padding: 60px 20px;
    background:
        radial-gradient(circle at 20% 20%, rgba(90, 40, 180, 0.35), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(0, 140, 255, 0.25), transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(160, 0, 180, 0.22), transparent 40%),
        #050507;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(90, 0, 255, 0.12);
    filter: blur(100px);
    top: -180px;
    left: -180px;
    animation: float 8s ease-in-out infinite alternate;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(0, 170, 255, 0.10);
    filter: blur(100px);
    bottom: -180px;
    right: -180px;
    animation: float2 10s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes float {
    from { transform: translate(0, 0); }
    to { transform: translate(120px, 80px); }
}

@keyframes float2 {
    from { transform: translate(0, 0); }
    to { transform: translate(-100px, -60px); }
}

.container {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: auto;
}

h1 {
    font-size: 38px;
    margin: 0;
    letter-spacing: 6px;
    font-weight: 800;
    text-shadow: 0 0 25px rgba(140, 100, 255, 0.6);
}

.subtitle {
    color: #b9b9c5;
    font-size: 17px;
    margin: 12px 0 45px;
    letter-spacing: 2px;
}

a {
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 460px;
    min-height: 72px;
    margin: 18px auto;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    color: white;
    text-decoration: none;
    font-size: 19px;
    font-weight: bold;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    transition: transform 0.25s ease, background 0.25s ease;
}

a:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.13);
}

.icon {
    font-size: 28px;
    margin-right: 16px;
}

.footer {
    margin-top: 50px;
    color: #777783;
    font-size: 12px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

<h1>DJ MELLO</h1>

<div class="subtitle">OFFICIAL LINKS</div>

<span class="icon">▶️</span> YouTube
</a>

<span class="icon">🎵</span> TikTok
</a>

<a href="https://www.instagram.com/djmello2026?igsi=Ym01YmRzZmd3YjE2" target="_blank">
<span class="icon">📸</span> Instagram
</a>

<div class="footer">DJ MELLO</div>

</div>

</body>
</html>
