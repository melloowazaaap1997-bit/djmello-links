* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    background:
        radial-gradient(circle at 15% 10%, rgba(128, 45, 255, 0.28), transparent 32%),
        radial-gradient(circle at 85% 20%, rgba(0, 170, 255, 0.22), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(180, 35, 255, 0.18), transparent 38%),
        #050508;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(110, 40, 255, 0.10);
    filter: blur(90px);
    top: -180px;
    left: -180px;
    animation: glowOne 10s ease-in-out infinite alternate;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(0, 150, 255, 0.08);
    filter: blur(90px);
    bottom: -190px;
    right: -190px;
    animation: glowTwo 12s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes glowOne {
    to {
        transform: translate(130px, 90px);
    }
}

@keyframes glowTwo {
    to {
        transform: translate(-100px, -70px);
    }
}
